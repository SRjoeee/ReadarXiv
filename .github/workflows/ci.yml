name: CI

on:
  push:
    branches: [main]
  pull_request:

# (the token-holding job reads the repository and nothing else: no write scope on GITHUB_TOKEN, none kept in the checkout's git config)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # (pnpm comes with corepack, at the version package.json names: the job that fetches the fixtures holds the bucket's read token,
      # and no third party's action runs in a job that holds a token — tests/scripts/rules-workflows.test.ts)
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # The fixtures the repository may not hold (tests/fixtures/README.md): restored from the cache, fetched from arXiv
      # only when missing, and saved the moment they are verified — not at the end of the job, which a failing test
      # would skip. Last but the tests, which alone read them, so arXiv being unreachable costs the tests only. One path
      # per entry `for` tests, the same list in both steps — a test holds them together. The pinned bytes are also kept in the
      # private bucket (tests/fixtures/README.md): the fetch reads them from there before arXiv, whose pages move
      - id: fixtures-cache
        uses: actions/cache/restore@v4
        with:
          key: remote-fixtures-${{ hashFiles('tests/fixtures/remote.json', 'scripts/fetch-fixtures.mjs', 'scripts/r2-read.mjs') }}
          path: |
            tests/fixtures/arxiv/2312.17527.html
            tests/fixtures/arxiv/2401.00418.html
            tests/fixtures/arxiv/2401.00596.html
            tests/fixtures/arxiv/2608.29808.html
            tests/fixtures/arxiv/2609.00245.html
            tests/fixtures/svg/2608.29808-bounter-case.svg
            tests/fixtures/svg/2607.24653-AET_blackbox_curve.svg
      - run: node scripts/fetch-fixtures.mjs
        env:
          READARXIV_CI_TOKEN: ${{ secrets.READARXIV_CI_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - if: steps.fixtures-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: remote-fixtures-${{ hashFiles('tests/fixtures/remote.json', 'scripts/fetch-fixtures.mjs', 'scripts/r2-read.mjs') }}
          path: |
            tests/fixtures/arxiv/2312.17527.html
            tests/fixtures/arxiv/2401.00418.html
            tests/fixtures/arxiv/2401.00596.html
            tests/fixtures/arxiv/2608.29808.html
            tests/fixtures/arxiv/2609.00245.html
            tests/fixtures/svg/2608.29808-bounter-case.svg
            tests/fixtures/svg/2607.24653-AET_blackbox_curve.svg
      - run: pnpm test
