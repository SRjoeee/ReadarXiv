name: CI

# The release check's fast tier on GitHub's runners (lab/release-check/CI.md): `check` (the unit gates and the census), `reader`
# (the reader package's browser checks) and `extension` (the extension's offline browser suites), on every pull request and on
# every push to main and rebuild/v2. The full and release tiers read the lab's data and run on the maintainer's machine, never
# here: this repository is public, and no job of it runs on a runner of his (CI.md, "Security"; tests/scripts/ci-workflows.test.ts
# holds every workflow of the repository to the rules written there).
on:
  push:
    branches: [main, rebuild/v2]
  pull_request:

# (the token-holding job reads the repository and nothing else: no write scope on GITHUB_TOKEN, none kept in the checkout's git config)
permissions:
  contents: read

# A pull request's newer push stops its older run; every push to a branch is a group of its own, run to its end
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # (pnpm comes with corepack, at the version package.json names: the job that fetches the fixtures holds the bucket's read token,
      # and no third party's action runs in a job that holds a token — tests/scripts/rules-workflows.test.ts)
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      # The fixtures the repository may not hold (tests/fixtures/README.md): restored from the cache, fetched from arXiv
      # only when missing, and saved the moment they are verified — not at the end of the job, which a failing test
      # would skip. Last but the tests, which alone read them, so arXiv being unreachable costs the tests only. One path
      # per entry `for` tests, the same list in both steps — a test holds them together. The pinned bytes are also kept in the
      # private bucket (tests/fixtures/README.md): the fetch reads them from there before arXiv, whose pages move.
      # The cache is a pull request's of this repository alone, read and written by nothing else. These papers are arXiv's under its
      # non-exclusive licence, never redistributed (tests/fixtures/README.md), and a cache saved on main is one any pull request can
      # restore, a fork's included, whose own workflow file decides what happens to it; a pull request's cache is read by that pull
      # request alone. So a push to main saves none (its fetch reads the bucket), and a fork's pull request neither reads nor saves
      # (it has no token, and fetches from arXiv). The key's `pr-` names the entries made so, apart from the one main once saved
      # under the old name, which nothing reads any more (the gate pack's cache follows the same rule, rules-gate.yml)
      - id: fixtures-cache
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: remote-fixtures-pr-${{ hashFiles('tests/fixtures/remote.json', 'scripts/fetch-fixtures.mjs', 'scripts/r2-read.mjs') }}
          path: |
            tests/fixtures/arxiv/2312.17527.html
            tests/fixtures/arxiv/2401.00418.html
            tests/fixtures/arxiv/2401.00596.html
            tests/fixtures/arxiv/2608.29808.html
            tests/fixtures/arxiv/2609.00245.html
            tests/fixtures/svg/2608.29808-bounter-case.svg
            tests/fixtures/svg/2607.24653-AET_blackbox_curve.svg
      - run: node scripts/fetch-fixtures.mjs
        env:
          READARXIV_CI_TOKEN: ${{ secrets.READARXIV_CI_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.fixtures-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: remote-fixtures-pr-${{ hashFiles('tests/fixtures/remote.json', 'scripts/fetch-fixtures.mjs', 'scripts/r2-read.mjs') }}
          path: |
            tests/fixtures/arxiv/2312.17527.html
            tests/fixtures/arxiv/2401.00418.html
            tests/fixtures/arxiv/2401.00596.html
            tests/fixtures/arxiv/2608.29808.html
            tests/fixtures/arxiv/2609.00245.html
            tests/fixtures/svg/2608.29808-bounter-case.svg
            tests/fixtures/svg/2607.24653-AET_blackbox_curve.svg
      - run: pnpm test
      # The complexity and debt census of this tree alone (gates.mjs `census`), judged by its ratchet: a measure above the value
      # census-ledger.json records fails, naming what added to it. The measures that read the website's tree or today's engine are
      # skipped here with their reason (neither is on GitHub's runner); 8 s on the maintainer's machine at 2ed857426
      - name: census
        run: node lab/release-check/census.mjs --no-today

  # The reader package's browser checks on its own fixtures (gates.mjs `harness`) and today's layer's small capitals in three
  # browsers (`e2e:small-caps`): no network but the install's and the browsers' download, no lab data. Without the website's served
  # faces (licensed files the repository may not hold) the checks that lay with them say so and are skipped, not passed. This job,
  # and `extension`, hold no secret, no environment and no cache of their own, and their token reads the repository alone: a fork's
  # pull request runs them as they are, and nothing they run reaches a credential.
  # A pinned image: the browsers draw with its libraries and fonts, which a moving label would change under the checks
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright's own builds at the lockfile's version and the system libraries they need (apt, which the runner allows)
      - name: Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: harness
        run: node packages/reader/e2e/run.mjs
      # (each check runs whatever the one before it gave, so that a failure in one hides no other's)
      - name: e2e:small-caps
        if: ${{ !cancelled() }}
        run: pnpm e2e:small-caps

  # The extension's offline browser suites on its default build (the rebuilt reader behind the extension's host), each behind a
  # route table that answers every request or fails the run (gates.mjs `e2e:reader`, `e2e:framing`, `e2e:a11y`, `e2e:viewer`,
  # `e2e:registration`). Headless Chromium of Playwright's `chromium` channel, which loads an extension
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - id: build
        run: pnpm build
      # (each suite runs on the build whatever the suite before it gave, so that a failure in one hides no other's)
      - name: e2e:reader
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm e2e:reader
      - name: e2e:framing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm e2e:framing
      - name: e2e:a11y
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm e2e:a11y
      - name: e2e:viewer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm e2e:viewer
      - name: e2e:registration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm e2e:registration
