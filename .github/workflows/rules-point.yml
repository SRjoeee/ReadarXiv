name: Rules point

# Moves the rule set's pointer to a version already published: the rollback. Staging's is a click; production's waits for the
# maintainer, the required reviewer of the environment rules-production. Nothing is published here, and nothing is built: the
# script reads no dependency.
#
# One pointer, one queue: this job and the publish job of the same environment (rules-publish.yml) write the same pointer, so they
# share a concurrency group (rules-pointer-staging, rules-pointer-production) and never run together. A production rollback also
# first cancels every publish run that has not finished: one still measuring the live engines, or waiting for the maintainer's
# approval, would otherwise reach production after it and move the pointer back over it.

on:
  workflow_dispatch:
    inputs:
      schema:
        description: 'The rule set schema (RULES_SCHEMA), a positive integer'
        required: true
        default: '1'
        type: string
      version:
        description: 'The published version to point to, a positive integer'
        required: true
        type: string
      environment:
        description: 'Where to move the pointer'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  # (no environment: cancelling a run is what anyone who may dispatch this workflow may do by hand, and the rollback itself still
  # waits for the reviewer below. It holds the only write permission of the three workflows, and no secret.)
  cancel-publishes:
    name: Cancel the publishes not finished
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel
        run: |
          # every state a run has before it ends: one that is still measuring the live engines reaches the approval later
          for status in requested queued pending in_progress waiting; do
            for id in $(gh run list --workflow rules-publish.yml --status "$status" --limit 100 --json databaseId --jq '.[].databaseId'); do
              gh run cancel "$id"
              echo "cancelled run $id ($status)"
            done
          done

  point:
    name: Point ${{ inputs.environment }} to version ${{ inputs.version }}
    # a rollback that could not cancel the unfinished publishes is not made: one approved later would undo it
    needs: cancel-publishes
    if: ${{ !cancelled() && (needs.cancel-publishes.result == 'success' || needs.cancel-publishes.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'rules-production' || 'rules-staging' }}
    timeout-minutes: 5
    concurrency:
      group: rules-pointer-${{ inputs.environment }}
      cancel-in-progress: false
      # every writer waits its turn: the default queue keeps one pending job and cancels it for the next
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Move the pointer
        env:
          RULES_PUBLISH_SECRET: ${{ secrets.RULES_PUBLISH_SECRET }}
          RULES_URL: ${{ inputs.environment == 'production' && vars.RULES_PRODUCTION_URL || vars.RULES_STAGING_URL }}
          SCHEMA: ${{ inputs.schema }}
          VERSION: ${{ inputs.version }}
        run: node lab/pdf/spikes/rules-publish.mjs point --url="$RULES_URL" --schema="$SCHEMA" --version="$VERSION"
